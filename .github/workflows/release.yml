name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
  packages: write
jobs:
  binaries:
    name: Build Agent and Server binaries
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: windows
            goarch: amd64
          - goos: windows
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: '1.27.3'
          check-latest: true
          cache: true
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 26.13.0
      - name: Install frontend dependencies
        working-directory: web-ui
        run: npm install --no-audit --no-fund
      - name: Build Vue frontend
        working-directory: web-ui
        run: npm run build
      - name: Build binaries
        shell: bash
        run: |
          mkdir -p dist
          ext=''
          if [[ '${{ matrix.goos }}' == 'windows' ]]; then ext='.exe'; fi
          for component in agent server; do
            CGO_ENABLED=0 GOOS='${{ matrix.goos }}' GOARCH='${{ matrix.goarch }}' \
              go build -trimpath -ldflags='-s -w' \
              -o "dist/avenlytic-${component}-${{ matrix.goos }}-${{ matrix.goarch }}${ext}" "./cmd/${component}"
          done
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: avenlytic-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*
  docker:
    name: Build and publish container image
    runs-on: ubuntu-latest
    needs: binaries
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: docker/setup-qemu-action@v4.4.0
      - uses: docker/setup-buildx-action@v4.4.1
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=tag
            type=raw,value=latest
      - uses: docker/build-push-action@v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - id: agent-meta
        uses: docker/metadata-action@v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}-agent
          tags: |
            type=ref,event=tag
            type=raw,value=latest
      - uses: docker/build-push-action@v7.4.0
        with:
          context: .
          file: Dockerfile.agent
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.agent-meta.outputs.tags }}
          labels: ${{ steps.agent-meta.outputs.labels }}
          cache-from: type=gha,scope=agent
          cache-to: type=gha,scope=agent,mode=max
  dockerhub:
    name: Publish to Docker Hub
    runs-on: ubuntu-latest
    needs: binaries
    if: ${{ vars.DOCKERHUB_USERNAME != '' }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: docker/setup-qemu-action@v4.4.0
      - uses: docker/setup-buildx-action@v4.4.1
      - name: Verify Docker Hub token is configured
        env:
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: test -n "$DOCKERHUB_TOKEN"
      - name: Login to Docker Hub
        uses: docker/login-action@v4.7.0
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6.2.0
        with:
          images: ${{ vars.DOCKERHUB_USERNAME }}/avenlytic
          tags: |
            type=ref,event=tag
            type=raw,value=latest
      - uses: docker/build-push-action@v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=dockerhub
          cache-to: type=gha,scope=dockerhub,mode=max
      - id: agent-meta
        uses: docker/metadata-action@v6.2.0
        with:
          images: docker.io/${{ vars.DOCKERHUB_USERNAME }}/avenlytic-agent
          tags: |
            type=ref,event=tag
            type=raw,value=latest
      - uses: docker/build-push-action@v7.4.0
        with:
          context: .
          file: Dockerfile.agent
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.agent-meta.outputs.tags }}
          labels: ${{ steps.agent-meta.outputs.labels }}
          cache-from: type=gha,scope=dockerhub-agent
          cache-to: type=gha,scope=dockerhub-agent,mode=max
  github-release:
    runs-on: ubuntu-latest
    needs: [binaries, docker]
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          path: release-assets
          pattern: avenlytic-*
          merge-multiple: true
      - uses: softprops/action-gh-release@v3.0.3
        with:
          files: release-assets/*
          generate_release_notes: true
